name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Check tag matches pubspec version
        run: |
          PUB=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+)\+([0-9]+).*/\1/')
          CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+)\+([0-9]+).*/\2/')
          TAG=${GITHUB_REF_NAME#v}
          echo "pubspec=$PUB+$CODE tag=$TAG"
          if [ "$PUB" != "$TAG" ]; then echo "::error::Tag v$TAG does not match pubspec version $PUB"; exit 1; fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Restore config and signing key from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          mkdir -p env && echo "$APP_ENV_JSON" | base64 -d > env/app.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build signed APKs (per-ABI + universal)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Every APK shares the pubspec versionCode, so any of them can upgrade any other.
          flutter build apk --release --split-per-abi --dart-define-from-file=env/app.json -P force-version-code-ignoring-abi=true
          flutter build apk --release --dart-define-from-file=env/app.json
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk ../../../../dist/arnav-chat-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk ../../../../dist/arnav-chat-armeabi-v7a.apk
          cp app-x86_64-release.apk ../../../../dist/arnav-chat-x86_64.apk
          cp app-release.apk ../../../../dist/arnav-chat-universal.apk
          cd ../../../../dist
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs dist/arnav-chat-universal.apk | grep -i 'SHA-256'

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/checksums.txt
          generate_release_notes: true
          make_latest: true

      - name: Remove secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/app/google-services.json lib/firebase_options.dart env/app.json
