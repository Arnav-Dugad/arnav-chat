name: arnav_chat
description: "Arnav Chat"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# versionName+versionCode. Bump with: dart run tool/bump_version.dart [major|minor|patch]
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  cached_network_image: ^4.0.5
  flutter_blurhash: ^0.9.1
  dio: ^5.11.1
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  record: ^7.1.2
  just_audio: ^0.10.6
  video_player: ^2.14.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  blurhash_dart: ^1.2.1
  image: ^4.12.0
  path: ^1.9.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_1024.png
  min_sdk_android: 24
  adaptive_icon_background: assets/brand/icon_background.png
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  web:
    generate: true
    image_path: assets/brand/icon_1024.png
    background_color: "#0A0B10"
    theme_color: "#2350E6"

flutter_native_splash:
  color: "#F6F7FA"
  image: assets/brand/splash_logo.png
  color_dark: "#0A0B10"
  image_dark: assets/brand/splash_logo.png
  android_12:
    image: assets/brand/splash_android12.png
    color: "#F6F7FA"
    image_dark: assets/brand/splash_android12.png
    color_dark: "#0A0B10"
  web: true
